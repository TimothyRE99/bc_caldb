[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bc_caldb"
version = "0.2.1"
requires-python = ">=3.12"
description = "Scripts for running science analysis on level 1 BlackCAT data."
authors = [
    {name = "Timothy R Emeigh", email = "tre8@psu.edu"}
]
maintainers = [
    {name = "Timothy R Emeigh", email = "tre8@psu.edu"}
]
classifiers = [
]

dependencies = [
    "astropy",
    "matplotlib",
    "numpy",
]

[dependency-groups]
dev = [
    "polars",
]

[project.scripts]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["bc_caldb", "bc_caldb.*"]
